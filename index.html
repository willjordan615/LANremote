<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAN Remote</title><style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#101216;color:#e8e9ed;margin:0 auto;max-width:440px;padding:16px}h1{font-size:24px;margin:0 0 8px}p{margin:8px 0;min-height:24px;color:#aebbc9}button,input,select{font:inherit;border:1px solid #414954;border-radius:10px;background:#232932;color:#fff;padding:12px;min-height:48px;touch-action:manipulation}button:active{background:#506b82}button:disabled{opacity:.35}input,select{width:100%}.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1;min-width:0}.pad,.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.pad button{height:72px;font-size:27px}.pad .ok{background:#324d65;font-size:20px;font-weight:bold}details{margin-top:12px}summary{padding:10px 0;cursor:pointer}#error{color:#ffb9a9}label{display:block;font-size:14px;margin-top:12px;color:#bfc8d1}
</style><main><h1>LAN Remote</h1><p id="status" role="status">Starting…</p><label for="devices">Discovered TVs</label><div class="row"><select id="devices"><option value="">Choose device</option></select><button id="scan">Refresh</button></div><label for="ip">Device IP address</label><div class="row"><input id="ip" placeholder="192.168.1.42" inputmode="decimal"><button id="connect">Connect</button></div><div id="pair" hidden><label for="pin">Code on TV</label><div class="row"><input id="pin" maxlength="6" autocomplete="off" placeholder="6 characters"><button id="submit">Pair</button></div></div><p id="error" role="alert"></p><div class="row"><button data-key="POWER">⏻ Power</button><button data-key="HOME">Home</button><button data-key="BACK">Back</button></div><div class="pad"><span></span><button data-key="DPAD_UP" aria-label="Up">▲</button><span></span><button data-key="DPAD_LEFT" aria-label="Left">◀</button><button data-key="DPAD_CENTER" class="ok">OK</button><button data-key="DPAD_RIGHT" aria-label="Right">▶</button><span></span><button data-key="DPAD_DOWN" aria-label="Down">▼</button><span></span></div><div class="row"><button data-key="VOLUME_DOWN">Vol −</button><button data-key="VOLUME_MUTE">Mute</button><button data-key="VOLUME_UP">Vol +</button></div><div class="row"><button data-key="MEDIA_REWIND">⏪</button><button data-key="MEDIA_PLAY_PAUSE">⏯</button><button data-key="MEDIA_FAST_FORWARD">⏩</button></div><div class="row"><button data-key="CHANNEL_DOWN">Ch −</button><button data-key="MENU">Menu</button><button data-key="CHANNEL_UP">Ch +</button></div><details><summary>Number pad</summary><div class="keys" id="numbers"></div></details><details><summary>Connection options</summary><div class="row"><button id="forget">Re-pair</button><button id="disconnect">Disconnect</button></div></details></main><script>
const el=id=>document.getElementById(id);let oldDevices='';
for(const n of [1,2,3,4,5,6,7,8,9,0]){const b=document.createElement('button');b.textContent=n;b.dataset.key=n;el('numbers').append(b);}
const buttons=[...document.querySelectorAll('[data-key]')];buttons.forEach(b=>b.disabled=true);
async function call(path,data={}){try{el('error').textContent='';const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error);await update();}catch(e){el('error').textContent=e.message;}}
async function update(){try{const s=await fetch('/state').then(r=>r.json());el('status').textContent=s.status;el('pair').hidden=!s.pairing;buttons.forEach(b=>b.disabled=!s.ready);if(s.ip&&!el('ip').value)el('ip').value=s.ip;const sig=JSON.stringify(s.devices);if(sig!==oldDevices){oldDevices=sig;const select=el('devices'),previous=select.value;select.replaceChildren(new Option('Choose device',''));for(const d of s.devices)select.add(new Option(d.name+' ('+d.ip+')',d.ip));select.value=previous;}}catch{el('status').textContent='Local server unavailable. Reopen Termux.';buttons.forEach(b=>b.disabled=true);}}
el('devices').onchange=()=>{if(el('devices').value)el('ip').value=el('devices').value;};el('scan').onclick=()=>call('/discover');el('connect').onclick=()=>call('/connect',{ip:el('ip').value.trim()});el('forget').onclick=()=>call('/forget',{ip:el('ip').value.trim()});el('disconnect').onclick=()=>call('/disconnect');el('submit').onclick=()=>call('/pin',{pin:el('pin').value.trim()});buttons.forEach(b=>b.onclick=()=>call('/key',{key:b.dataset.key}));update();setInterval(update,1000);
</script></html>
