name: Bluetooth APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install required Android SDK packages
        run: |
          sdkmanager --version
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: gradle -p android :app:assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk LANRemote-Bluetooth.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LANRemote-Bluetooth
          path: LANRemote-Bluetooth.apk
      - name: Publish installable debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "bluetooth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" LANRemote-Bluetooth.apk --title "Bluetooth prototype build ${GITHUB_RUN_NUMBER}" --notes "Experimental debug APK, Android 9+. Requires compatible Bluetooth HID device support and manual pairing. Future debug builds may require uninstalling this version before installing."
