name: Bluetooth APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install required Android SDK packages
        run: |
          sdkmanager --version
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Verify HID keyboard and mouse mappings
        run: |
          mkdir -p /tmp/lanremote-hid-test
          javac -d /tmp/lanremote-hid-test android/app/src/main/java/com/lanremote/bluetooth/HidKeys.java android/tests/HidKeysTest.java
          java -cp /tmp/lanremote-hid-test com.lanremote.bluetooth.HidKeysTest
          javac -d /tmp/lanremote-hid-test android/app/src/main/java/com/lanremote/bluetooth/CursorMath.java android/tests/CursorMathTest.java
          java -cp /tmp/lanremote-hid-test com.lanremote.bluetooth.CursorMathTest
          javac -d /tmp/lanremote-hid-test android/app/src/main/java/com/lanremote/bluetooth/IdlePolicy.java android/tests/IdlePolicyTest.java
          java -cp /tmp/lanremote-hid-test com.lanremote.bluetooth.IdlePolicyTest
          javac -d /tmp/lanremote-hid-test android/app/src/main/java/com/lanremote/bluetooth/TvPlatform.java android/tests/TvPlatformTest.java
          java -cp /tmp/lanremote-hid-test com.lanremote.bluetooth.TvPlatformTest
          javac -cp /tmp/lanremote-hid-test -d /tmp/lanremote-hid-test android/app/src/main/java/com/lanremote/bluetooth/TvProfile.java android/tests/TvProfileTest.java
          java -cp /tmp/lanremote-hid-test com.lanremote.bluetooth.TvProfileTest
          javac -cp /tmp/lanremote-hid-test -d /tmp/lanremote-hid-test android/app/src/main/java/com/lanremote/bluetooth/TvRecoveryPolicy.java android/tests/TvRecoveryPolicyTest.java
          java -cp /tmp/lanremote-hid-test com.lanremote.bluetooth.TvRecoveryPolicyTest
          javac -d /tmp/lanremote-hid-test android/app/src/main/java/com/lanremote/bluetooth/RokuKeys.java android/tests/RokuKeysTest.java
          java -cp /tmp/lanremote-hid-test com.lanremote.bluetooth.RokuKeysTest
          javac -d /tmp/lanremote-hid-test android/app/src/main/java/com/lanremote/bluetooth/AtvWire.java android/tests/AtvWireTest.java
          java -cp /tmp/lanremote-hid-test com.lanremote.bluetooth.AtvWireTest
          javac -d /tmp/lanremote-hid-test android/app/src/main/java/com/lanremote/bluetooth/SonyKeys.java android/tests/SonyKeysTest.java
          java -cp /tmp/lanremote-hid-test com.lanremote.bluetooth.SonyKeysTest
          javac -d /tmp/lanremote-hid-test android/app/src/main/java/com/lanremote/bluetooth/HostIdentity.java android/tests/HostIdentityTest.java
          java -cp /tmp/lanremote-hid-test com.lanremote.bluetooth.HostIdentityTest
          javac -cp /tmp/lanremote-hid-test -d /tmp/lanremote-hid-test android/app/src/main/java/com/lanremote/bluetooth/TextEdit.java android/app/src/main/java/com/lanremote/bluetooth/RelayWire.java android/tests/RelayWireTest.java android/tests/TextEditTest.java
          java -cp /tmp/lanremote-hid-test com.lanremote.bluetooth.RelayWireTest
          java -cp /tmp/lanremote-hid-test com.lanremote.bluetooth.TextEditTest
          javac -cp /tmp/lanremote-hid-test -d /tmp/lanremote-hid-test android/app/src/main/java/com/lanremote/bluetooth/RelayPairWire.java android/tests/RelayPairWireTest.java
          java -cp /tmp/lanremote-hid-test com.lanremote.bluetooth.RelayPairWireTest
          javac -cp /tmp/lanremote-hid-test -d /tmp/lanremote-hid-test android/app/src/main/java/com/lanremote/bluetooth/WakeAddress.java android/tests/WakeAddressTest.java
          java -cp /tmp/lanremote-hid-test com.lanremote.bluetooth.WakeAddressTest
          javac -cp /tmp/lanremote-hid-test -d /tmp/lanremote-hid-test android/app/src/main/java/com/lanremote/bluetooth/WakePacket.java android/tests/WakePacketTest.java
          java -cp /tmp/lanremote-hid-test com.lanremote.bluetooth.WakePacketTest
      - run: gradle -p android :app:assembleDebug :app:assembleRelease
      - name: Prepare signed APK
        env:
          SIGNING_KEY: ${{ secrets.LANREMOTE_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.LANREMOTE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          input=android/app/build/outputs/apk/release/app-release-unsigned.apk
          debug=android/app/build/outputs/apk/debug/app-debug.apk
          if [[ -n "$SIGNING_KEY" && -n "$SIGNING_PASSWORD" ]]; then
            umask 077
            keystore="$(mktemp)"
            trap 'rm -f "$keystore"' EXIT
            printf '%s' "$SIGNING_KEY" | base64 -d > "$keystore"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks "$keystore" --ks-key-alias lanremote --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD --out LANRemote-Bluetooth.apk "$input"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks "$keystore" --ks-key-alias lanremote --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD --out /tmp/LANRemote-debug-signed.apk "$debug"
            echo "SIGNING_KIND=stable" >> "$GITHUB_ENV"
          else
            echo "Both permanent signing secrets are required for release builds" >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose LANRemote-Bluetooth.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify /tmp/LANRemote-debug-signed.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging LANRemote-Bluetooth.apk > /tmp/lanremote-badging.txt
          if grep -q "^application-debuggable" /tmp/lanremote-badging.txt; then
            echo "Production APK must not be debuggable" >&2
            exit 1
          fi
          grep -q "package: name='com.lanremote.bluetooth'" /tmp/lanremote-badging.txt
          release_bytes=$(stat -c%s LANRemote-Bluetooth.apk)
          debug_bytes=$(stat -c%s /tmp/LANRemote-debug-signed.apk)
          [[ "$release_bytes" -lt "$debug_bytes" && "$release_bytes" -le 10000000 ]]
          printf "Signed debug APK: %s bytes\nSigned optimized APK: %s bytes\n" "$debug_bytes" "$release_bytes" | tee apk-size.txt >> "$GITHUB_STEP_SUMMARY"
          echo "RELEASE_BYTES=$release_bytes" >> "$GITHUB_ENV"
          echo "DEBUG_BYTES=$debug_bytes" >> "$GITHUB_ENV"
          code=$(sed -nE 's/.*versionCode ([0-9]+);.*/\1/p' android/app/build.gradle)
          [[ "$code" =~ ^[0-9]+$ ]]
          echo "APP_CODE=$code" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: LANRemote-Bluetooth
          path: LANRemote-Bluetooth.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-build-diagnostics
          path: |
            apk-size.txt
            android/app/build/outputs/mapping/release/mapping.txt
      - name: Publish permanently signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'LANREMOTE_VERSION_CODE: %s\nLANREMOTE_SIGNING: %s\n\nAndroid 9+. Bluetooth HID compatibility depends on the phone and TV. Android requires confirmation for updates. First migration from a debug-signed build requires manual reinstall.\n' "$APP_CODE" "$SIGNING_KIND" > release-notes.txt
          version=$(sed -nE "s/.*versionName '([^']+)'.*/\1/p" android/app/build.gradle)
          [[ -n "$version" ]]
          printf "\nProduction APK: %s bytes (same-version debug: %s bytes).\n" "$RELEASE_BYTES" "$DEBUG_BYTES" >> release-notes.txt
          gh release create "bluetooth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" LANRemote-Bluetooth.apk --title "LANremote $version" --notes-file release-notes.txt --latest
