name: Dependency advisory audit
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/security.yml', '.github/scripts/audit_dependencies.py']
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: gradle -p android :app:exportRuntimeDependencies
      - run: python3 .github/scripts/audit_dependencies.py android/app/build/reports/runtime-dependencies.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit
          path: |
            android/app/build/reports/runtime-dependencies.json
            dependency-audit.json
